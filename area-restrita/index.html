<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://klxcwkclydirdxomkbtv.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Área dos Irmãos</title>
    <link rel="icon" href="../assets/logo-classica.jpg" />
    <link rel="stylesheet" href="./css/area.css" />
    <script src="../config.js"></script>
  </head>
  <body class="area-body">
    <div id="shell"></div>
    <main class="area-main">
      <div class="area-wrap">
        <header class="page-hero">
          <p class="eyebrow">Bem-vindo à Área dos Irmãos</p>
          <h1 id="saudacao">Bem-vindo</h1>
          <p class="page-date" id="data-hoje"></p>
          <div class="gold-rule" aria-hidden="true"></div>
        </header>
        <section id="destaque-pessoal" class="highlight-card" hidden></section>
        <div class="dashboard-grid">
          <section class="area-card session-card" id="card-eventos">
            <h2 class="session-kicker">Próxima sessão</h2>
            <div id="proximo-evento"></div>
          </section>
          <section class="area-card" id="card-comunicados">
            <h2>Comunicados</h2>
            <div id="comunicados"></div>
          </section>
          <section class="area-card">
            <h2>Próximos aniversários</h2>
            <div id="proximos-niver"></div>
          </section>
          <section class="area-card">
            <h2>Próximas datas maçônicas</h2>
            <div id="proximas-iniciacoes"></div>
          </section>
        </div>
      </div>
    </main>
    <script type="module" src="./home.js"></script>
  </body>
</html>
