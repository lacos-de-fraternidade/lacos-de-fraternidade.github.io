<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://klxcwkclydirdxomkbtv.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Meu perfil | Área dos Irmãos</title>
    <link rel="stylesheet" href="../css/area.css" />
    <script src="../../config.js"></script>
  </head>
  <body class="area-body">
    <div id="shell"></div>
    <main class="area-main">
      <div class="area-wrap">
        <section class="area-card">
          <h1>Meu perfil</h1>
          <p id="nome"></p>
          <p id="perfil"></p>
          <p>Para alterar CIM, e-mail ou nome, solicite à Secretaria.</p>
        </section>
      </div>
    </main>
    <script type="module">
      import { bootPage } from "../js/page.js";
      await bootPage("Meu perfil", async ({ profile }) => {
        document.querySelector("#nome").textContent = profile.nome;
        document.querySelector("#perfil").textContent = `Perfil: ${profile.perfil}`;
      });
    </script>
  </body>
</html>
