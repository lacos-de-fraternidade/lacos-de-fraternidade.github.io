<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://klxcwkclydirdxomkbtv.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Importar celebrações | Área dos Irmãos</title>
    <link rel="stylesheet" href="../css/area.css" />
    <script src="../../config.js"></script>
  </head>
  <body class="area-body">
    <div id="shell"></div>
    <main class="area-main"><div class="area-wrap"><section class="area-card">
      <h1>Importar celebrações</h1>
      <p>Cole linhas no formato: CIM;tipo;mes;dia;nome. Tipos: aniversario, iniciacao, familiar.</p>
      <textarea id="csv" rows="8" placeholder="00001234;aniversario;8;17;João"></textarea>
      <p class="status" id="status" role="status"></p>
      <button class="button button-primary" id="importar" type="button">Importar</button>
    </section></div></main>
    <script type="module">
      import { requireMember } from "../js/guard.js";
      import { bootPage } from "../js/page.js";
      import { invokeFunction } from "../js/client.js";
      const ctx = await requireMember({ staff: true });
      if (!ctx) throw new Error("redirect");
      await bootPage("Importar celebrações", async () => {
        document.querySelector("#importar").addEventListener("click", async () => {
          const itens = document.querySelector("#csv").value.split("\n").map((line) => line.trim()).filter(Boolean).map((line) => {
            const [cim, tipo, mes, dia, nome] = line.split(";");
            return { cim, tipo, mes: Number(mes), dia: Number(dia), nome_exibicao: nome };
          });
          const { data } = await invokeFunction("gerenciar-irmao", { acao: "importar_celebracoes", itens }, ctx.session.access_token);
          const status = document.querySelector("#status");
          status.classList.toggle("is-ok", Boolean(data?.ok));
          status.textContent = data?.ok ? `${data.importados} registro(s) importado(s).` : (data?.error || "Não foi possível importar.");
        });
      });
    </script>
  </body>
</html>
