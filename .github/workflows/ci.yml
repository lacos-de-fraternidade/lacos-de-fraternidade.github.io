name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Start Supabase
        run: supabase start

      - name: Show Supabase status
        run: supabase status

      - name: Run Node tests
        env:
          INTEGRATION_DB: "1"
        run: node --test

      - name: Run database tests
        run: supabase test db --local
