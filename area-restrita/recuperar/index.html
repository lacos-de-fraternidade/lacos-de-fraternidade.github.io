<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://klxcwkclydirdxomkbtv.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Recuperar senha | Área dos Irmãos</title>
    <link rel="icon" href="../../assets/logo-classica.jpg" />
    <link rel="stylesheet" href="../css/area.css" />
    <script src="../../config.js"></script>
  </head>
  <body class="area-body">
    <main class="auth-shell">
      <section class="auth-card">
        <p class="eyebrow">Recuperação</p>
        <h1>Esqueci minha senha</h1>
        <p>Informe sua CIM. Não criamos contas por aqui; o acesso depende de cadastro prévio da Secretaria.</p>
        <form id="recuperar-form">
          <div class="field">
            <label for="cim">CIM</label>
            <input id="cim" name="cim" inputmode="numeric" autocomplete="username" required maxlength="20" />
          </div>
          <p class="status" id="status" role="status"></p>
          <button class="button button-primary" type="submit">Enviar instruções</button>
        </form>
        <div class="auth-links">
          <a href="../login/">Voltar ao acesso</a>
        </div>
      </section>
    </main>
    <script type="module" src="./recuperar.js"></script>
  </body>
</html>
