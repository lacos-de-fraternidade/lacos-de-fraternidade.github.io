<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://klxcwkclydirdxomkbtv.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Redefinir senha | Área dos Irmãos</title>
    <link rel="icon" href="../../assets/logo-classica.jpg" />
    <link rel="stylesheet" href="../css/area.css" />
    <script src="../../config.js"></script>
  </head>
  <body class="area-body">
    <main class="auth-shell">
      <section class="auth-card">
        <div id="redefinir-gate">
          <p class="eyebrow">Segurança</p>
          <h1>Redefinir senha</h1>
          <p>Por segurança, o link só é validado quando você clica no botão abaixo. Assim o e-mail não gasta o link sozinho.</p>
          <p class="status" id="gate-status" role="status" aria-live="polite"></p>
          <button class="button button-primary" id="redefinir-continuar-btn" type="button" hidden>Continuar a redefinição</button>
        </div>
        <form id="redefinir-form" hidden>
          <p class="eyebrow">Segurança</p>
          <h1>Nova senha</h1>
          <div class="field">
            <label for="senha">Nova senha</label>
            <div class="password-field">
              <input id="senha" type="password" autocomplete="new-password" required />
              <button type="button" id="toggle-senha" class="password-toggle" aria-label="Mostrar senha" aria-pressed="false"></button>
            </div>
            <div class="meter"><span id="meter-bar" style="width:0"></span></div>
            <small id="meter-label">Força da senha</small>
            <ul class="req-list" id="req-list" aria-live="polite"></ul>
          </div>
          <div class="field">
            <label for="confirma">Confirmar senha</label>
            <div class="password-field">
              <input id="confirma" type="password" autocomplete="new-password" required />
              <button type="button" id="toggle-confirma" class="password-toggle" aria-label="Mostrar senha" aria-pressed="false"></button>
            </div>
          </div>
          <p class="status" id="status" role="status"></p>
          <button class="button button-primary" type="submit">Salvar senha</button>
        </form>
      </section>
    </main>
    <script type="module" src="./redefinir.js"></script>
  </body>
</html>
